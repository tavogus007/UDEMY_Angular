<div class="container mt-5">
    <div class="d-flex justify-content-center">
        <div class="w-50">
            <div class="mb-3 d-flex align-items-center">
                <label for="operadorA" class="form-label me-2 text-nowrap">Operador A</label>
                <input type="number" id="operadorA" class="form-control text-center" [(ngModel)]="operador_A">
            </div>
            <div class="mb-3 d-flex align-items-center">
                <label for="operadorB" class="form-label me-2 text-nowrap">Operador B</label>
                <input type="number" id="operadorB" class="form-control text-center" [(ngModel)]="operador_B">
            </div>
            <button class="btn btn-primary mb-3 w-100" (click)="sumar()">SUMAR</button>
            <p class="text-center">Resultado: {{ resultado }}</p>
        </div>
    </div>
</div>
